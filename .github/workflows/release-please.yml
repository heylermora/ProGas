name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prepare release PR or publish merged release
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # Events created by GITHUB_TOKEN do not start pull_request workflows.
      # workflow_dispatch is exempt, so validate the bot branch explicitly.
      - name: Run CI on release PR branches
        if: steps.release.outputs.prs_created == 'true'
        uses: actions/github-script@v7
        env:
          RELEASE_PRS: ${{ steps.release.outputs.prs }}
        with:
          script: |
            for (const pr of JSON.parse(process.env.RELEASE_PRS || '[]')) {
              await github.rest.actions.createWorkflowDispatch({
                ...context.repo,
                workflow_id: 'main.yml',
                ref: pr.headBranchName,
              });
            }
